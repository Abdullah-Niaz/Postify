{% extends "../base.html" %}
{% load static %}

{% block title %}Password Reset Complete — Postify{% endblock title %}

{% block content %}
<div class="editorial-auth-shell">
  <div class="editorial-auth-card auth-success-slate">
    <div class="success-icon">
      <i class="fa-solid fa-circle-check"></i>
    </div>
    <div class="auth-meta-badge">Recovery Complete</div>
    <h1 class="auth-title">Password Reset</h1>
    <p class="auth-subtitle" style="margin-bottom: 24px;">
      Your new password has been set. You may now sign in to your reader account.
    </p>
    <a href="{% url 'login' %}" class="btn-editorial btn-editorial-primary">
      Sign In to Journal
    </a>
  </div>
</div>
{% endblock content %}
