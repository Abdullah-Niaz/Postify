{% extends "../base.html" %}
{% load static %}

{% block title %}Password Changed — Postify{% endblock title %}

{% block content %}
<div class="editorial-auth-shell">
  <div class="editorial-auth-card auth-success-slate">
    <div class="success-icon">
      <i class="fa-solid fa-check"></i>
    </div>
    <div class="auth-meta-badge">Security Updated</div>
    <h1 class="auth-title">Password Changed</h1>
    <p class="auth-subtitle" style="margin-bottom: 24px;">
      Your password has been successfully updated. Your account is secure.
    </p>
    <a href="{% url 'blog:index' %}" class="btn-editorial btn-editorial-primary">
      Return to Front Page
    </a>
  </div>
</div>
{% endblock content %}
